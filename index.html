    <style>
      /* Inline theme variables to avoid a color flash before the CSS loads. */
      :root {
        color-scheme: light;
        --color-bg: #f3efec;
        --color-text-primary: #292929;
        --color-text-secondary: #414141;
        --color-text-dim: #565656;
        --color-link-hover: #1d1d1d;
        --color-divider: #dcd1bf;
        --color-institution: #553c00;
      }

      [data-theme='dark'] {
        color-scheme: dark;
        --color-bg: #050505;
        --color-text-primary: #cccccc;
        --color-text-secondary: #ababab;
        --color-text-dim: #909090;
        --color-link-hover: #dbdbdb;
        --color-divider: #252525;
        --color-institution: #d6a53b;
      }

      html, body {
        background: var(--color-bg);
        color: var(--color-text-primary);
      }
    </style>
    <script>
      // Apply the saved theme before paint, falling back to the system theme; keep theme-color in sync.
      (() => {
        const mq = window.matchMedia('(prefers-color-scheme: dark)')
        const stored = () => {
          try {
            const value = localStorage.getItem('theme')
            return value === 'light' || value === 'dark' ? value : null
          } catch {
            return null
          }
        }
        const apply = () => {
          const theme = stored() ?? (mq.matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--color-bg').trim()
        }
        apply()
        mq.addEventListener('change', apply)
      })()
    </script>
  </head>

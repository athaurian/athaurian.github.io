      rel="stylesheet"
    />
    <title>athaurian</title>
    <style>
      /* This block inlines theme variables to prevent a flash of incorrect colors before the
         bundled CSS loads. The inline `<script>` element sets `data-theme`, and these
         rules immediately resolve the CSS custom properties. Light doubles as
         the `:root` fallback so colors stay defined even without `data-theme`. */
      :root {
        --color-bg: #f3efec;
        --color-text-primary: #303030;
        --color-text-secondary: #474747;
        --color-text-dim: #676767;
        --color-divider: #d8cdbc;
        --color-institution: #725200;
      }

      [data-theme='dark'] {
        --color-bg: #050505;
        --color-text-primary: #d4d4d4;
        --color-text-secondary: #b3b3b3;
        --color-text-dim: #8a8a8a;
        --color-divider: #222222;
        --color-institution: #f4bc45;
      }

      html, body {
        background: var(--color-bg);
        color: var(--color-text-primary);
      }
    </style>
    <script>
      // Apply the system theme before paint to avoid a color flash. The
      // theme-color meta mirrors the page background, so its value is read
      // from the `--color-bg` variable instead of duplicating the hex codes.
      (() => {
        const mq = window.matchMedia('(prefers-color-scheme: dark)')
        const apply = () => {
          document.documentElement.dataset.theme = mq.matches ? 'dark' : 'light'
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--color-bg').trim()
        }
        apply()
        mq.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="max-width: 66ch; margin: 2rem auto; text-align: center; color: var(--color-text-secondary)">
        JavaScript is off, so there's nothing to render. The
        <a href="https://github.com/athaurian/athaurian.github.io" style="color: inherit">source</a> is on GitHub.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
